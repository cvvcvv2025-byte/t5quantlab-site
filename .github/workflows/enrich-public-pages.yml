name: Enrich Public Pages

on:
  push:
    branches: [main]
    paths:
      - 'scripts/enrich-public-pages.mjs'
      - '.github/workflows/enrich-public-pages.yml'

permissions:
  contents: write

jobs:
  enrich:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Enrich sitemap public pages
        run: node scripts/enrich-public-pages.mjs
      - name: Commit enriched pages
        run: |
          if git diff --quiet; then
            echo "No page changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "seo: enrich public pages with social metadata and recommendations"
          git push
