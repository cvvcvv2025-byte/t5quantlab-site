name: Enrich Public Pages

on:
  push:
    branches: [main]
    paths:
      - 'sitemap.xml'
      - 'scripts/append-multimethod-sitemap.mjs'
      - 'scripts/expand-multimethod-phase2.mjs'
      - 'scripts/expand-multimethod-phase3.mjs'
      - 'scripts/expand-multimethod-phase4.mjs'
      - 'scripts/expand-multimethod-phase5.mjs'
      - 'scripts/expand-multimethod-phase6.mjs'
      - 'scripts/expand-multimethod-phase7.mjs'
      - 'scripts/expand-multimethod-phase8.mjs'
      - 'scripts/expand-multimethod-phase9.mjs'
      - 'assets/specialist-trainer.js'
      - 'assets/specialist-trainer.css'
      - 'assets/account-local-training.js'
      - 'scripts/enrich-public-pages.mjs'
      - '.github/workflows/enrich-public-pages.yml'

permissions:
  contents: write

jobs:
  enrich:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Expand multimethod phase 2 hubs
        run: node scripts/expand-multimethod-phase2.mjs
      - name: Expand multimethod phase 3 hubs
        run: node scripts/expand-multimethod-phase3.mjs
      - name: Expand multimethod phase 4 hubs
        run: node scripts/expand-multimethod-phase4.mjs
      - name: Expand multimethod phase 5 hubs
        run: node scripts/expand-multimethod-phase5.mjs
      - name: Expand multimethod phase 6 hubs
        run: node scripts/expand-multimethod-phase6.mjs
      - name: Expand multimethod phase 7 hubs
        run: node scripts/expand-multimethod-phase7.mjs
      - name: Wire specialist trainer phase 8
        run: node scripts/expand-multimethod-phase8.mjs
      - name: Wire My T5 local training phase 9
        run: node scripts/expand-multimethod-phase9.mjs
      - name: Ensure multimethod sitemap routes
        run: node scripts/append-multimethod-sitemap.mjs
      - name: Enrich sitemap public pages
        run: node scripts/enrich-public-pages.mjs
      - name: Commit enriched pages
        run: |
          if git diff --quiet; then
            echo "No page changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "feat: add My T5 local training overview"
          git push
