name: Syntax Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check Worker syntax
        run: |
          node scripts/prepare-release.mjs --ci
          node --check src/builder-lifecycle.js
          node --check src/support-worker.js
          node --check src/runtime-license.js
          node --check src/release-info.js
          node --check src/worker.js
          node --check src/gated-worker.js
          node --check src/commercial-worker.js
          node --check src/audit-guard-worker.js
          node --check src/final-worker.js
          node --check src/account-worker.js
          node --check src/training-worker.js
          node --check src/training-product.js
          node --check src/marketing-worker.js
          node --check src/runtime-worker.js
      - name: Check external JavaScript assets
        run: |
          find assets -type f -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Check inline page scripts
        run: node scripts/check-inline-js.mjs
      - name: Exercise customer delivery against local SQLite
        run: |
          node scripts/account-session-behavior-check.mjs
          node scripts/delivery-behavior-check.mjs
          node scripts/protected-delivery-behavior-check.mjs
          node scripts/paypal-checkout-behavior-check.mjs
          node scripts/training-behavior-check.mjs
          node scripts/training-feedback-behavior-check.mjs
          node scripts/builder-recovery-behavior-check.mjs
          node scripts/runtime-health-behavior-check.mjs
          node scripts/alipay-behavior-check.mjs
          node scripts/runtime-license-behavior-check.mjs
          node scripts/signed-runtime-license-behavior-check.mjs
          node scripts/signed-runtime-ui-behavior-check.mjs
          node scripts/simple-install-behavior-check.mjs
          node scripts/runtime-client-state-check.mjs
          node scripts/release-origin-behavior-check.mjs
      - name: Check payment contract
        run: node scripts/payment-contract-check.mjs
      - name: Check production payment ownership contract
        run: node scripts/production-payment-contract-check.mjs
      - name: Check account contract
        run: node scripts/account-contract-check.mjs
      - name: Check marketing contract
        run: node scripts/marketing-contract-check.mjs
      - name: Check runtime contract
        run: node scripts/runtime-contract-check.mjs
      - name: Check deployment contract
        run: node scripts/deployment-contract-check.mjs
      - name: Check practice trainer contract
        run: node scripts/practice-contract-check.mjs
      - name: Check multi-method content contract
        run: node scripts/multimethod-contract-check.mjs
      - name: Check training review contract
        run: node scripts/training-review-contract-check.mjs
      - name: Check free source inspector contract
        run: node scripts/source-inspector-contract-check.mjs
      - name: Check customer-facing copy boundary
        run: node scripts/customer-copy-contract-check.mjs
      - name: Check Start route next-step contract
        run: node scripts/start-route-contract-check.mjs
      - name: Check indicator candidate release boundary
        run: node scripts/indicator-release-contract-check.mjs
      - name: Check protected indicator download boundary
        run: |
          node scripts/indicator-download-contract-check.mjs
          node scripts/indicator-mt5-delivery-check.mjs
      - name: Check protected EA download boundary
        run: node scripts/ea-download-contract-check.mjs
      - name: Check Range Martingale release and entitlement boundary
        run: node scripts/range-martingale-delivery-check.mjs
      - name: Check Aggressive protected delivery
        run: node scripts/range-aggressive-delivery-check.mjs
      - name: Check Aggressive profile evidence and delivery status
        run: node scripts/range-aggressive-publication-check.mjs
      - name: Check SEO and case visual contract
        run: node scripts/seo-contract-check.mjs
      - name: Check internal content links
        run: node scripts/check-internal-links.mjs
