name: Syntax Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check Worker syntax
        run: |
          node --check src/worker.js
          node --check src/gated-worker.js
      - name: Check inline page scripts
        run: node scripts/check-inline-js.mjs
