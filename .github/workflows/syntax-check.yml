name: Syntax Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check Worker syntax
        run: |
          node --check src/worker.js
          node --check src/gated-worker.js
          node --check src/commercial-worker.js
          node --check src/final-worker.js
      - name: Check external JavaScript assets
        run: |
          find assets -type f -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Check inline page scripts
        run: node scripts/check-inline-js.mjs
      - name: Check payment contract
        run: node scripts/payment-contract-check.mjs
      - name: Check practice trainer contract
        run: node scripts/practice-contract-check.mjs
      - name: Check free source inspector contract
        run: node scripts/source-inspector-contract-check.mjs
      - name: Check internal content links
        run: node scripts/check-internal-links.mjs
