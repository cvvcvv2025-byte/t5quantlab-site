<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>T5 Accounts Admin</title><meta name="robots" content="noindex,nofollow"><link rel="stylesheet" href="/assets/styles.css"><link rel="stylesheet" href="/assets/account.css"></head><body><header class="topbar"><div class="container nav"><a class="brand" href="/"><span class="mark">T5</span><span>T5 Accounts Admin</span></a></div></header><main><section class="page-hero"><div class="container account-wrap"><div class="eyebrow">PRIVATE ADMIN · CUSTOMER ACCOUNTS</div><h1>客户账户后台。</h1><p>只有提供有效管理员密钥后才会读取客户邮箱。密钥仅保存在当前标签页 sessionStorage，不写入服务器页面或localStorage。</p></div></section><section class="section"><div class="container account-wrap"><div class="account-card"><div class="account-field"><label for="key">BUILDER_ACCESS_KEY</label><input id="key" type="password" autocomplete="off" placeholder="管理员密钥"></div><div class="account-actions"><button class="btn primary" id="load" type="button">读取客户列表</button><button class="btn" id="clear" type="button">清除本标签页密钥</button></div><div id="status" class="account-status account-hidden"></div></div><div class="section" style="padding-left:0;padding-right:0;padding-bottom:0"><div class="account-card"><h2>账户</h2><div id="summary" class="account-note">尚未读取。</div><div id="users" class="account-list" style="margin-top:14px"></div></div></div></div></section></main><script src="/assets/main.js"></script><script>const $=id=>document.getElementById(id);const STORE='t5_admin_key_session';$('key').value=sessionStorage.getItem(STORE)||'';function show(t,c=''){const x=$('status');x.textContent=t;x.className='account-status'+(c?' '+c:'');x.classList.remove('account-hidden')}function fmt(v){if(!v)return'—';try{return new Date(v).toLocaleString('zh-CN')}catch{return v}}$('load').addEventListener('click',async()=>{const key=$('key').value.trim();if(!key){show('请输入管理员密钥。','account-warn');return}sessionStorage.setItem(STORE,key);$('load').disabled=true;try{const r=await fetch('/api/admin/accounts',{headers:{'X-Builder-Access-Key':key},credentials:'same-origin'});const d=await r.json();if(!r.ok||!d.ok)throw new Error(d.error||'读取失败');const users=d.users||[];const subscribed=users.filter(x=>Number(x.marketing_consent||0)===1).length;const paid=users.filter(x=>Number(x.paid_orders||0)>0).length;$('summary').textContent=`账户 ${users.length} · 营销订阅 ${subscribed} · 已付费客户 ${paid}`;$('users').innerHTML=users.map(u=>`<div class="account-row"><div><b class="account-email">${u.email}</b><br><small>${u.user_id}<br>注册 ${fmt(u.created_at)} · 最近登录 ${fmt(u.last_login_at)}</small></div><div><span class="account-badge ${Number(u.marketing_consent||0)===1?'good':''}">${Number(u.marketing_consent||0)===1?'已订阅':'未订阅'}</span><br><small>付费订单 ${u.paid_orders||0}</small></div></div>`).join('');show('客户列表读取成功。','account-good')}catch(e){show(e.message,'account-warn')}finally{$('load').disabled=false}});$('clear').addEventListener('click',()=>{sessionStorage.removeItem(STORE);$('key').value='';$('users').innerHTML='';$('summary').textContent='已清除本标签页管理员密钥。';show('已清除。','account-good')});</script></body></html>
