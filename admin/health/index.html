<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>T5 Runtime Health</title><meta name="robots" content="noindex,nofollow"><link rel="stylesheet" href="/assets/styles.css"><link rel="stylesheet" href="/assets/account.css"><style>.health-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.health-card{border:1px solid var(--line);border-radius:14px;background:#07111f;padding:14px}.health-card b{display:block;font-size:18px}.health-card small{color:var(--muted);line-height:1.6}.health-card.good{border-color:#2f655e}.health-card.bad{border-color:#7b4c4c}.health-list{display:grid;gap:8px}.health-row{display:flex;justify-content:space-between;gap:16px;border-bottom:1px solid var(--line);padding:9px 0}.health-row span:last-child{text-align:right;word-break:break-word}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}.deep-note{margin-top:12px;color:var(--muted);font-size:12px;line-height:1.65}@media(max-width:680px){.health-grid{grid-template-columns:1fr}.health-row{display:block}.health-row span{display:block;margin-top:3px}}</style></head><body><header class="topbar"><div class="container nav"><a class="brand" href="/admin/"><span class="mark">T5</span><span>T5 Runtime Health</span></a><nav class="navlinks"><a href="/admin/accounts/">Accounts</a><a href="/admin/campaigns/">Campaigns</a></nav></div></header><main><section class="page-hero"><div class="container account-wrap"><div class="eyebrow">PRIVATE ADMIN · RUNTIME PRE-FLIGHT</div><h1>网站运行状态检查。</h1><p>这里不会显示任何Secret值，只显示绑定、配置和关键服务是否正常。管理员密钥只保存在当前标签页 sessionStorage。</p></div></section><section class="section"><div class="container account-wrap"><div class="account-card"><div class="account-field"><label for="key">BUILDER_ACCESS_KEY</label><input id="key" type="password" autocomplete="off" placeholder="管理员密钥"></div><div class="account-actions"><button class="btn primary" id="run" type="button">运行基础检查</button><button class="btn" id="deep" type="button">运行外部连接深检</button><button class="btn" id="clear" type="button">清除本标签页密钥</button></div><p class="deep-note">“外部连接深检”只读取 OpenAI 模型权限、PayPal OAuth/Webhook 配置和 Resend 域名状态；不会生成 AI 内容、不会发送邮件、不会创建订单或扣款。</p><div id="status" class="account-status account-hidden"></div></div><div class="section" style="padding-left:0;padding-right:0;padding-bottom:0"><div class="health-grid" id="summary"></div></div><div class="section" style="padding-left:0;padding-right:0;padding-bottom:0"><div class="account-card"><h2>详细结果</h2><div id="details" class="health-list"><div class="account-note">尚未运行检查。</div></div></div></div></div></section></main><script src="/assets/main.js"></script><script>const $=id=>document.getElementById(id);const STORE='t5_admin_key_session';$('key').value=sessionStorage.getItem(STORE)||'';function show(t,c=''){const x=$('status');x.textContent=t;x.className='account-status'+(c?' '+c:'');x.classList.remove('account-hidden')}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}async function readJsonResponse(r){const type=(r.headers.get('content-type')||'').toLowerCase();const text=await r.text();if(!type.includes('application/json'))throw new Error(`运行检查API没有返回JSON（HTTP ${r.status}）。这通常表示生产Worker尚未部署最新版本。`);let d;try{d=JSON.parse(text)}catch{throw new Error('运行检查API返回了无法解析的JSON。')}return d}function card(label,ok,detail){return `<div class="health-card ${ok?'good':'bad'}"><b>${ok?'✓':'✕'} ${esc(label)}</b><small>${esc(detail)}</small></div>`}function row(label,value){return `<div class="health-row"><span>${esc(label)}</span><span class="mono">${esc(value)}</span></div>`}function render(d){const c=d.configuration||{},checks=d.checks||{},db=d.database||{},ext=d.external||null;const cards=[card('核心服务健康',d.healthy===true,d.healthy?'D1 / R2 / OpenAI / 账户 / PayPal基础链路已满足运行条件':'存在核心阻断项，先修复下方红项'),card('生产收款就绪',d.production_ready===true,d.production_ready?'PayPal已是live且未开启测试模式，可以进入外部深检':'不要开放真实付款；检查PayPal环境、测试模式和核心链路'),card('账户登录',c.account_ready===true,c.account_ready?'D1 + Resend + Account Secret 已配置':'邮箱登录所需配置不完整'),card('付费 Builder 基础',c.paid_builder_ready===true,c.paid_builder_ready?'OpenAI / PayPal / D1 / R2 / 账户 / Audit Salt 已配置':'付费源码处理尚未满足全部基础条件'),card('Checkout入口',c.checkout_ready===true,c.checkout_ready?'整条服务链允许创建订单':'后端会阻止创建付款订单'),card('营销邮件',d.marketing_healthy===true,d.marketing_healthy?'营销配置与相关数据库表已就绪':'不影响核心交易，但营销邮件暂未完全就绪'),card('D1 实际查询',checks.d1_query?.ok===true,checks.d1_query?.detail||'未检查'),card('R2 实际访问',checks.r2_access?.ok===true,checks.r2_access?.detail||'未检查'),card('免费源码体检',c.free_source_inspector_ready===true,c.free_source_inspector_ready?'静态资源可用，浏览器本地体检可运行':'静态资源绑定异常，免费体检不可视为就绪')];if(ext){cards.unshift(card('生产外部连接验证',d.production_verified===true,d.production_verified?'OpenAI / PayPal / Webhook / Resend 外部检查全部通过':'至少一个外部服务检查未通过'));cards.push(card('OpenAI模型权限',ext.openai_model?.ok===true,ext.openai_model?.detail||'未检查'),card('PayPal OAuth',ext.paypal_oauth?.ok===true,ext.paypal_oauth?.detail||'未检查'),card('PayPal Webhook',ext.paypal_webhook?.ok===true,ext.paypal_webhook?.detail||'未检查'),card('Resend发件域',ext.resend_domains?.ok===true,ext.resend_domains?.detail||'未检查'))}$('summary').innerHTML=cards.join('');const missingSecrets=(d.missing_secrets||[]).join(', ')||'无';const missingTables=(db.missing_tables||[]).join(', ')||'无';const missingMarketing=(db.missing_marketing_tables||[]).join(', ')||'无';const detailRows=[row('Runtime',d.runtime||'—'),row('PayPal环境',c.paypal_environment||'—'),row('支付测试模式',c.payment_test_mode?'ON':'OFF'),row('Checkout Ready',c.checkout_ready?'YES':'NO'),row('OpenAI',c.openai?'configured':'missing'),row('邮箱登录',c.email_auth?'configured':'missing'),row('PayPal',c.paypal?'configured':'missing'),row('AUDIT_HASH_SALT',c.audit_salt?'configured':'missing'),row('缺失Secrets',missingSecrets),row('数据库表数量',db.table_count??'—'),row('缺失核心表',missingTables),row('缺失营销表',missingMarketing),row('分析模型',d.models?.analyze||'—'),row('修改模型',d.models?.modify||'—'),row('登录发件人',d.email_from||'—'),row('营销发件人',d.marketing_email_from||'—')];if(ext){detailRows.push(row('OpenAI模型检查',ext.openai_model?.detail||'—'),row('PayPal OAuth检查',ext.paypal_oauth?.detail||'—'),row('PayPal Webhook URL',ext.paypal_webhook?.url_match?'MATCH':'NOT MATCH'),row('PayPal缺失事件',(ext.paypal_webhook?.missing_events||[]).join(', ')||'无'),row('Resend域名',(ext.resend_domains?.domains||[]).map(x=>`${x.domain}:${x.status}/${x.sending}`).join(' · ')||'—'))}$('details').innerHTML=detailRows.join('')}async function runHealth(deep=false){const key=$('key').value.trim();if(!key){show('请输入管理员密钥。','account-warn');return}sessionStorage.setItem(STORE,key);$('run').disabled=true;$('deep').disabled=true;try{const r=await fetch('/api/admin/runtime-health'+(deep?'?deep=1':''),{headers:{'X-Builder-Access-Key':key},credentials:'same-origin',cache:'no-store'});const d=await readJsonResponse(r);if(r.status===403)throw new Error('管理员密钥无效。');if(!d.ok)throw new Error(d.error||'运行检查失败');render(d);if(deep){if(d.production_verified)show('深检通过：核心链路、生产收款与外部服务均已验证。','account-good');else show('深检完成：仍有外部或生产配置未通过，请按红项处理。','account-warn')}else if(d.production_ready)show('基础检查通过：核心链路与生产收款配置已就绪。继续运行“外部连接深检”。','account-good');else if(d.healthy)show('核心链路健康，但尚未达到生产收款条件。请看“生产收款就绪”红项。','account-warn');else show('检查完成：存在核心未就绪项，请按红项处理。','account-warn')}catch(e){show(e.message,'account-warn')}finally{$('run').disabled=false;$('deep').disabled=false}}$('run').addEventListener('click',()=>runHealth(false));$('deep').addEventListener('click',()=>runHealth(true));$('clear').addEventListener('click',()=>{sessionStorage.removeItem(STORE);$('key').value='';$('summary').innerHTML='';$('details').innerHTML='<div class="account-note">已清除本标签页管理员密钥。</div>';show('已清除。','account-good')});</script></body></html>
