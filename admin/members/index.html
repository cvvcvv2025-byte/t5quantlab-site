<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>T5 Member Delivery Admin</title><meta name="robots" content="noindex,nofollow"><link rel="stylesheet" href="/assets/styles.css"><link rel="stylesheet" href="/assets/account.css"><style>.ops-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.ops-grid .account-card{height:100%}.account-field select{width:100%;padding:12px;border:1px solid var(--line);border-radius:10px;background:#07111f;color:#edf6ff}@media(max-width:820px){.ops-grid{grid-template-columns:1fr}}</style></head>
<body><header class="topbar"><div class="container nav"><a class="brand" href="/admin/"><span class="mark">T5</span><span>Member Delivery</span></a></div></header><main><section class="page-hero"><div class="container account-wrap"><div class="eyebrow">PRIVATE ADMIN · PROTECTED DOWNLOAD</div><h1>指标会员交付。</h1><p>安装包只上传到私有存储；客户必须登录且拥有有效产品权限才能下载。</p></div></section><section class="section"><div class="container account-wrap">
<div class="account-card"><div class="account-field"><label for="key">BUILDER_ACCESS_KEY</label><input id="key" type="password" autocomplete="off" placeholder="管理员密钥"></div><div class="account-actions"><button class="btn" id="clear" type="button">清除本标签页密钥</button></div><div id="status" class="account-status account-hidden"></div></div>
<div class="ops-grid" style="margin-top:18px"><div class="account-card"><h2>上传指标交付包</h2><p class="account-note">系统只接受所选指标对应的固定 SHA-256 正式 ZIP；选错或改动过的文件会被拒绝。</p><div class="account-field"><label for="artifactType">指标版本</label><select id="artifactType"><option value="mtf-structure-panel">MTF Structure Panel · v0.1.1</option><option value="neckline-mtf">Neckline MTF · v0.1.2</option><option value="progress-candle">Progress Candle · v0.1.2</option></select></div><div class="account-field"><label for="artifact">客户交付包 ZIP</label><input id="artifact" type="file" accept=".zip,application/zip"></div><button class="btn primary" id="upload" type="button">校验并上传</button></div>
<div class="account-card"><h2>管理指标权限</h2><div class="account-field"><label for="email">T5账户邮箱</label><input id="email" type="email" autocomplete="off" placeholder="customer@example.com"></div><div class="account-field"><label for="product">权限类型</label><select id="product"><option value="indicator_membership">指标会员（全部已发布指标）</option><option value="premium_membership">高级会员（全部已发布指标）</option><option value="mtf_structure_panel_mt4">仅 MTF Structure Panel</option><option value="neckline_mtf_mt4">仅 Neckline MTF</option><option value="progress_candle_mt4">仅 Progress Candle</option></select></div><div class="account-field"><label for="expiry">到期时间（可留空为长期）</label><input id="expiry" type="datetime-local"></div><div class="account-actions"><button class="btn primary" id="grant" type="button">授予权限</button><button class="btn" id="revoke" type="button">撤销权限</button></div></div></div>
<div class="notice" style="margin-top:18px">客户必须先用相同邮箱注册并登录T5账户。这里不创建账户，也不绕过邮箱验证。</div></div></section></main><script src="/assets/main.js"></script><script>
const $=id=>document.getElementById(id),STORE='t5_admin_key_session';
$('key').value=sessionStorage.getItem(STORE)||'';
function key(){const v=$('key').value.trim();if(v)sessionStorage.setItem(STORE,v);return v}
function show(t,c=''){const x=$('status');x.textContent=t;x.className='account-status'+(c?' '+c:'');x.classList.remove('account-hidden')}
async function parse(r){let d={};try{d=await r.json()}catch{}if(!r.ok||!d.ok)throw new Error([d.error,d.code].filter(Boolean).join(' · ')||'操作失败');return d}
$('clear').onclick=()=>{sessionStorage.removeItem(STORE);$('key').value='';show('已清除本标签页密钥。','account-good')};
$('upload').onclick=async()=>{const k=key(),f=$('artifact').files[0],artifact=$('artifactType').value;if(!k||!f){show('请选择ZIP并输入管理员密钥。','account-warn');return}$('upload').disabled=true;try{const d=await parse(await fetch(`/api/admin/indicator-artifacts/upload?artifact=${encodeURIComponent(artifact)}`,{method:'PUT',headers:{'X-Builder-Access-Key':k,'Content-Type':'application/zip'},body:f,credentials:'same-origin'}));show(`上传成功：${d.artifact.filename} · ${d.artifact.size} bytes`,'account-good')}catch(e){show(e.message,'account-warn')}finally{$('upload').disabled=false}};
async function entitlement(action){const k=key(),email=$('email').value.trim(),product_code=$('product').value,raw=$('expiry').value;if(!k||!email){show('请输入邮箱和管理员密钥。','account-warn');return}const body={action,email,product_code};if(action==='grant'&&raw)body.expires_at=new Date(raw).toISOString();try{const d=await parse(await fetch('/api/admin/member-entitlements',{method:'POST',headers:{'X-Builder-Access-Key':k,'Content-Type':'application/json'},body:JSON.stringify(body),credentials:'same-origin'}));show(`${action==='grant'?'已授予':'已撤销'}：${d.email} · ${d.product_code}`,'account-good')}catch(e){show(e.message,'account-warn')}}
$('grant').onclick=()=>entitlement('grant');$('revoke').onclick=()=>entitlement('revoke');
</script></body></html>
