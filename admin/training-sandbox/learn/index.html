<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>突破确认训练｜T5 Quant Lab</title><link rel="stylesheet" href="/assets/breakout-pilot/course.css"><script src="/assets/breakout-pilot/member.js" defer></script></head><body><header><div class="top"><a class="brand" href="/">T5 QUANT LAB</a><a href="/account/">账户</a></div></header><main class="wrap"><p class="eyebrow">交易判断训练 · 突破确认</p><h1>沙箱训练验收</h1><p class="notice warning">仅供运营测试。<a href="/admin/training-sandbox/">返回支付验收</a></p><p class="muted">合成教学情境，不是行情预测或下单建议。首次选择保留，补做另记。</p><p id="status" role="status" class="notice">正在核验账户与训练权限…</p><div id="app" hidden><details><summary>本期规则与安排</summary><p id="disclosure"></p><ol id="rules"></ol><p>先完成三道前测，再做日常训练，最后完成三道后测。前后测在整组提交后开放评分；后续涨跌不影响答案。</p></details><div class="shell"><section class="stage" id="stage" tabindex="-1"><p id="position" class="eyebrow"></p><h2 id="title"></h2><p id="context" class="facts"></p><div id="chart" class="chart"></div><form id="form"><div id="options"></div><button class="primary" id="submit">提交判断</button></form><p id="result" aria-live="polite"></p><div id="feedback" hidden class="feedback"><p id="explanation"></p><button type="button" id="future">揭晓后续示意</button><p id="futureText" hidden></p></div><div class="actions"><button id="prev" type="button">上一例</button><button id="next" type="button">下一例</button></div></section><aside class="side"><details open><summary>16个情境</summary><div id="nav"></div></details></aside></div></div><section class="report"><h2>我的训练记录</h2><p>首次匹配结果与最近一次结果分别保留。尚未完成的前后测不显示评分；到期后仍可查看、导出自己的作答记录。</p><div id="records"></div><button id="export" hidden>导出我的记录</button></section><p class="muted">训练成绩不代表实盘交易能力或收益。</p></main></body></html>
