<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>支付宝付款｜T5 Quant Lab</title><link rel="icon" href="/favicon.svg" type="image/svg+xml"><link rel="stylesheet" href="/assets/styles.css"><link rel="stylesheet" href="/assets/account.css"></head><body><header class="topbar"><div class="container nav"><a class="brand" href="/">T5 Quant Lab</a><a href="/account/">My T5</a></div></header><main class="container account-wrap" style="padding:60px 20px;max-width:760px"><h1>使用支付宝付款</h1><p>人民币一次性付款，不自动续费。付款确认后，服务会保存到当前 T5 账户。</p><section class="account-card"><h2 id="productName">正在读取商品…</h2><p id="price" style="font-size:32px;font-weight:800"></p><p id="details"></p><div class="account-status" id="accountState" role="status">正在检查账户…</div><a id="login" class="btn account-hidden" href="/account/login/?next=%2Fcheckout%2Falipay%2F">邮箱登录</a><label class="account-consent"><input id="terms" type="checkbox"><span>我已阅读并同意<a href="/refund-policy/" target="_blank" rel="noopener">退款与交付规则</a>及<a href="/privacy/" target="_blank" rel="noopener">隐私说明</a>。会员购买提供90天下载及更新权限；Builder Pass为30天、3次分析及2次修改。具体以本页所选商品为准。</span></label><div class="account-actions"><button id="pay" class="btn primary" disabled>创建订单并前往支付宝</button><button id="refresh" class="btn account-hidden">刷新付款状态</button><button id="close" class="btn account-hidden">核对并关闭未付款订单</button><button id="newOrder" class="btn account-hidden">创建新订单</button><a id="delivery" class="btn primary account-hidden" href="/account/">查看已购服务</a></div><div id="status" class="account-status" role="status">尚未发起付款。</div><p>创建订单不会扣款。请在支付宝收银台核对金额后确认；如已扣款，请刷新付款状态，勿重复付款。</p><p id="orderId" style="overflow-wrap:anywhere"></p></section><p><a href="/support/">联系支持</a> · <a href="/account/">返回会员中心</a></p></main><script src="/assets/alipay-checkout.js"></script></body></html>
