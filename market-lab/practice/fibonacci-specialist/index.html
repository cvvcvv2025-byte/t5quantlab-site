<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fibonacci Specialist 24题｜T5 Market Lab</title><meta name="description" content="Fibonacci专项24题：Swing选择、主趋势与执行Fib、0.382/0.5/0.618/0.705/0.786、1.272/1.618、重叠、失效和EA规则化。"><link rel="canonical" href="https://t5quantlab.com/market-lab/practice/fibonacci-specialist/"><link rel="stylesheet" href="/assets/styles.css"><link rel="stylesheet" href="/assets/account-nav.css"><style>.q{border:1px solid var(--line);border-radius:14px;background:#091827;padding:18px;margin:0 0 14px}.q small{color:var(--mint);font-weight:800}.snap{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}.snap div{border:1px solid #24415d;border-radius:10px;padding:10px;background:#071421}.snap b{color:#8fa7c1;font-size:12px}.snap span{display:block;margin-top:4px;color:#e9f4ff}.choices{line-height:1.8;color:#bdd0df}.q details{border-top:1px solid var(--line);padding-top:10px}.q summary{cursor:pointer;font-weight:800}.answer{margin-top:10px;color:#bdd0df;line-height:1.7}.answer strong{color:#9fe8d1}@media(max-width:720px){.snap{grid-template-columns:1fr}}</style></head><body><header class="topbar"><div class="container nav"><a class="brand" href="/"><span class="mark">T5</span><span>T5 Quant Lab</span></a><nav class="navlinks" id="navlinks"><a href="/market-lab/">Market Lab</a><a href="/library/fibonacci/">Fib教材</a><a href="/library/">Library</a></nav><button class="menu" id="menu">☰</button></div></header><main><section class="page-hero"><div class="container"><div class="breadcrumbs"><a href="/market-lab/">Market Lab</a> / Practice / Fibonacci</div><div class="eyebrow">24 SPECIALIST SCENARIOS · SWING · RETRACEMENT · EXTENSION</div><h1>Fib真正难的不是0.618，而是你到底在测哪一段推动。</h1><p>这24题训练Swing选择、回调深度、主趋势Fib与执行Fib职责、重叠区、Extension、失效和程序化边界。</p><div class="actions"><a class="btn primary" href="#pack">开始24题</a><a class="btn" href="/library/fibonacci/">先看教材</a></div></div></section><section class="section"><div class="container" id="pack"></div></section></main><footer class="footer"><div class="container"><div class="risk">Fibonacci用于位置与距离研究，不代表任何比例具有确定性预测能力。</div></div></footer><script src="/assets/main.js"></script><script>const Q=[
{id:'F001',t:'SWING',s:['H1上涨','M5最新推进','准备M5入场'],q:'执行级Fib优先测哪一段？',c:'A. 整个H1最低到最高\nB. 最新造成M5结构推进的有效Swing\nC. 随便选视觉最长的一段\nD. 从昨日开盘开始',a:'B。高周期Fib负责背景，执行Fib应对应当前执行周期的有效推动。'},
{id:'F002',t:'DIRECTION',s:['多头推动','起点低','终点高'],q:'多头回调Fib正确绘制方向？',c:'A. 高→低\nB. 低→高\nC. 左→右即可\nD. 与方向无关',a:'B。多头推动从有效低点拉到有效高点；空头相反。'},
{id:'F003',t:'0.382',s:['趋势很强','回调浅','结构未坏'],q:'0.382附近快速恢复推进，合理解释？',c:'A. 浅回调符合强趋势特征之一\nB. 必须继续等0.786\nC. 0.382一定反转\nD. Fib失效',a:'A。0.382只是浅回调尺度，不是保证。'},
{id:'F004',t:'0.5',s:['价格回到0.5','无结构重叠','无反应'],q:'能否因“50%很重要”直接入场？',c:'A. 能\nB. 不能，0.5只是测量参考且缺少其他证据\nC. 只有黄金能\nD. 只要加仓即可',a:'B。0.5甚至不是严格Fibonacci比例，不能替代Context和Reaction。'},
{id:'F005',t:'0.618',s:['0.618','旧结构','FVG重叠'],q:'这个位置比单独0.618更有价值的原因？',c:'A. 多个独立位置证据重叠\nB. 0.618本身必胜\nC. FVG一定回补\nD. 旧结构不会失效',a:'A。价值来自重叠，而不是比例本身。'},
{id:'F006',t:'DEEP',s:['0.786','关键HL已破','实体接受下方'],q:'“越深越便宜所以加仓”最大问题？',c:'A. 忽略原趋势结构可能已经失效\nB. 0.786太浅\nC. 应改用0.9\nD. 只需放大止损',a:'A。深回调提高了结构失效风险。'},
{id:'F007',t:'OTE',s:['0.705–0.786','有AOI','无执行信号'],q:'合理处理？',c:'A. 到区间就自动入场\nB. 当作Location，等待Reaction/Execution\nC. 永不交易\nD. 直接满仓',a:'B。OTE类区域仍只是位置。'},
{id:'F008',t:'REPAINT',s:['每次价格变化','重新选择Swing','直到0.618贴合持仓'],q:'这是什么偏差？',c:'A. 合理适配\nB. 事后重画/选择偏差\nC. 风险归一化\nD. 价格发现',a:'B。Swing必须先冻结，否则Fib会变成解释工具。'},
{id:'F009',t:'EXTENSION',s:['1.618更远','前高更近','前高有外部流动性'],q:'目标优先级更合理的是？',c:'A. 无视前高死等1.618\nB. 先考虑真实结构/流动性，再用Extension测距离\nC. 一律1.272\nD. 不设目标',a:'B。Extension不应凌驾于真实市场障碍。'},
{id:'F010',t:'MAIN VS EXEC',s:['H1 0.618','M5 0.382','二者不同'],q:'这一定是冲突吗？',c:'A. 是\nB. 不是，可能测量的是不同职责的Swing\nC. 只保留M5\nD. 只保留H1',a:'B。多周期Fib可以共存，但职责要分开。'},
{id:'F011',t:'TARGET',s:['Entry已定','T1前方结构近','1.272更远'],q:'如果策略以结构目标为主，应该？',c:'A. 强行把T1改到1.272\nB. 保留结构目标，Extension做Runner参考\nC. 删除T1\nD. 扩大仓位',a:'B。目标要服务策略语义。'},
{id:'F012',t:'INVALIDATION',s:['多头Fib','价格跌破推动起点','持续接受'],q:'此时Fib假设如何处理？',c:'A. 继续画更深比例\nB. 原推动假设失效，应重建Swing\nC. 改成1.272\nD. 加仓摊薄',a:'B。推动起点被有效破坏后不能继续用旧Fib扛单。'},
{id:'F013',t:'CONFLUENCE',s:['Fib 0.618','POC附近','区间中部'],q:'POC重叠就一定高质量吗？',c:'A. 是\nB. 不一定，区间中部仍可能缺乏位置优势\nC. POC必反转\nD. Fib失效',a:'B。重叠要结合Context，不是证据数量比赛。'},
{id:'F014',t:'SECOND REJECTION',s:['第一次触及0.618反弹','第二次回测','卖压减弱'],q:'第二次测试的意义主要在？',c:'A. 检查该区是否仍被接受/拒绝\nB. 必须加仓\nC. Fib变成支撑线\nD. 数学比例改变',a:'A。二次测试提供的是反应质量信息。'},
{id:'F015',t:'MULTI-TF',s:['H4深回调','M15出现新推动','M5执行'],q:'最佳职责链？',c:'A. H4定大位置，M15定方向/工作区，M5定Entry\nB. M5推翻全部高周期\nC. 只看H4\nD. 只看Fib',a:'A。Fib应服从多周期职责。'},
{id:'F016',t:'RISK',s:['0.618区域宽','SL固定很小','ATR上升'],q:'最大风险？',c:'A. SL可能落在正常噪音内\nB. 0.618太准\nC. ATR代表方向\nD. 应取消止损',a:'A。位置区与波动环境必须进入风险设计。'},
{id:'F017',t:'EA',s:['人工说“有效推动”','程序要实现','不同人选点不同'],q:'第一步应冻结什么？',c:'A. Swing算法与最小推动条件\nB. 颜色\nC. 交易手数\nD. 邮件格式',a:'A。没有Swing定义就没有可重复Fib。'},
{id:'F018',t:'EA',s:['ZigZag swing','参数变化','Fib结果大变'],q:'这说明？',c:'A. Swing算法是模型参数，必须做敏感性测试\nB. Fib无效\nC. 参数越细越好\nD. 只看历史最优',a:'A。Swing识别会直接改变所有比例。'},
{id:'F019',t:'LOOKAHEAD',s:['用未来高点作为Swing终点','回测很漂亮','实时当时尚未形成'],q:'问题是什么？',c:'A. Lookahead / future leak\nB. 正常确认\nC. Spread\nD. Session',a:'A。实时无法知道未来最终高点。'},
{id:'F020',t:'PARTIAL',s:['T1=前高','T2=1.618','T1已到'],q:'若规则是T1减半+BE，下一步？',c:'A. 按冻结规则执行，不因1.618更远取消减仓\nB. 临时全仓持有\nC. 扩大SL\nD. 重新画Fib',a:'A。管理规则不能被事后目标诱惑改写。'},
{id:'F021',t:'FAILURE',s:['0.705反弹','未破攻击Pivot','再次下压'],q:'这次反弹最合理的描述？',c:'A. Reaction，不等于Takeover\nB. 已完成反转\nC. Fib保证有效\nD. 必须做多',a:'A。位置反应与趋势接管是两层证据。'},
{id:'F022',t:'DATA',s:['TV与MT5高低点略不同','Swing边界变化','Fib线不同'],q:'需要审计什么？',c:'A. 数据源/Bar切分Parity\nB. 只改颜色\nC. 只改Fib比例\nD. 忽略差异',a:'A。高低点差异会传播到所有Fib层级。'},
{id:'F023',t:'ABlation',s:['策略含Fib+FVG+OB+RSI','回测有效','不知道谁贡献'],q:'下一步？',c:'A. 做Ablation逐项移除\nB. 再加MACD\nC. 增加更多Fib级别\nD. 只看胜率',a:'A。否则无法判断Fib是否真的增加信息。'},
{id:'F024',t:'AUDIT',s:['历史交易','想评估Fib作用','只记录Entry/Exit'],q:'还应至少记录？',c:'A. Swing起终点、使用级别、重叠因素、入场相对Fib位置\nB. 电脑型号\nC. K线颜色\nD. 新闻标题',a:'A。没有上下文就无法复核Fib规则是否一致。'}];function esc(x){return String(x).replace(/[&<>]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]))}document.getElementById('pack').innerHTML=Q.map(x=>`<article class="q" data-qid="${x.id}"><small>${x.id} · ${x.t}</small><div class="snap">${x.s.map((v,i)=>`<div><b>${['STATE','CONTEXT','FOCUS'][i]}</b><span>${esc(v)}</span></div>`).join('')}</div><h3>${esc(x.q)}</h3><div class="choices">${esc(x.c).replace(/\n/g,'<br>')}</div><details><summary>展开答案</summary><div class="answer"><strong>参考：</strong>${esc(x.a)}</div></details></article>`).join('');</script><script src="/assets/seo-structured.js"></script><script src="/assets/account-nav.js"></script></body></html>
