<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Risk Management Specialist 24题｜T5 Market Lab</title><meta name="description" content="风险与持仓管理专项24题：失效位、仓位、R、T1、部分平仓、保本、Runner、MFE/MAE、滑点与EA状态审计。"><link rel="canonical" href="https://t5quantlab.com/market-lab/practice/risk-management-specialist/"><link rel="stylesheet" href="/assets/styles.css"><link rel="stylesheet" href="/assets/account-nav.css"><style>.q{border:1px solid var(--line);border-radius:14px;background:#091827;padding:18px;margin:0 0 14px}.q small{color:var(--mint);font-weight:800}.snap{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}.snap div{border:1px solid #24415d;border-radius:10px;padding:10px;background:#071421}.snap b{color:#8fa7c1;font-size:12px}.snap span{display:block;margin-top:4px;color:#e9f4ff}.choices{line-height:1.8;color:#bdd0df}.q details{border-top:1px solid var(--line);padding-top:10px}.q summary{cursor:pointer;font-weight:800}.answer{margin-top:10px;color:#bdd0df;line-height:1.7}.answer strong{color:#9fe8d1}@media(max-width:720px){.snap{grid-template-columns:1fr}}</style></head><body><header class="topbar"><div class="container nav"><a class="brand" href="/"><span class="mark">T5</span><span>T5 Quant Lab</span></a><nav class="navlinks" id="navlinks"><a href="/market-lab/">Market Lab</a><a href="/library/risk-position-management/">风险教材</a><a href="/verification/">Verification</a></nav><button class="menu" id="menu">☰</button></div></header><main><section class="page-hero"><div class="container"><div class="breadcrumbs"><a href="/market-lab/">Market Lab</a> / Practice / Risk</div><div class="eyebrow">24 SPECIALIST SCENARIOS · RISK · T1 · BE · RUNNER</div><h1>好的持仓管理，必须在进场前就能写出来。</h1><p>这24题不讨论“怎样救单”，而是训练失效位、仓位、T1、部分平仓、保本、Runner、MFE/MAE和程序执行状态。</p><div class="actions"><a class="btn primary" href="#pack">开始24题</a><a class="btn" href="/library/risk-position-management/">先看教材</a></div></div></section><section class="section"><div class="container" id="pack"></div></section></main><footer class="footer"><div class="container"><div class="risk">风险与持仓管理用于研究与软件训练，不构成个性化投资建议。</div></div></footer><script src="/assets/main.js"></script><script>const Q=[
{id:'RK001',t:'INVALIDATION',s:['Entry 100','结构失效 96','想把SL放99.5'],q:'最大问题是什么？',c:'A. 止损过于接近正常噪音，未放在逻辑失效处\nB. 止损越小越好\nC. 结构不重要\nD. 应取消SL',a:'A。小止损只有在失效点本来就近时才有意义。'},
{id:'RK002',t:'POSITION SIZE',s:['每笔风险$20','SL距离2','另一笔SL距离5'],q:'若合约价值相同，手数应如何变化？',c:'A. 两笔一样\nB. SL更远的手数更小\nC. SL更远手数更大\nD. 与SL无关',a:'B。固定风险金额下，仓位应随失效距离反向变化。'},
{id:'RK003',t:'R',s:['风险$25','最终盈利$50','无部分平仓'],q:'结果是多少R？',c:'A. 0.5R\nB. 1R\nC. 2R\nD. 5R',a:'C。R以初始计划风险为基准。'},
{id:'RK004',t:'T1',s:['T1已到','规则减半','交易者想继续全仓'],q:'合理处理？',c:'A. 临时取消减仓\nB. 按冻结规则执行，除非策略版本正式变更\nC. 扩大SL\nD. 重画目标',a:'B。管理不能由当下情绪改写。'},
{id:'RK005',t:'PARTIAL',s:['程序显示T1 HIT','Broker部分平仓失败','状态仍切PROTECTED'],q:'这是什么问题？',c:'A. 状态机与真实执行脱节\nB. 正常\nC. 只影响界面\nD. 目标太近',a:'A。只有真实成交成功后才应推进状态。'},
{id:'RK006',t:'BREAKEVEN',s:['T1刚触及','立即BE','多数Runner被轻微回踩扫出'],q:'最值得审计什么？',c:'A. BE推进是否过早以及T1后MAE分布\nB. Entry颜色\nC. 胜率 בלבד\nD. 只调高目标',a:'A。BE不是免费动作，需要用T1后的真实路径验证。'},
{id:'RK007',t:'RUNNER',s:['半仓T1','剩余看T2','中途结构失效'],q:'Runner应如何处理？',c:'A. 因为已盈利所以忽略失效\nB. 按预先定义的结构退出规则处理\nC. 必须等T2\nD. 加仓',a:'B。Runner同样需要明确退出状态。'},
{id:'RK008',t:'MFE',s:['最终止损-1R','期间曾到+2.4R','未减仓'],q:'MFE告诉你什么？',c:'A. 交易曾有较大有利推进，管理可能值得复核\nB. Entry一定错误\nC. SL太宽必然\nD. MFE等于利润',a:'A。MFE用于分析目标和管理，不等于实际收益。'},
{id:'RK009',t:'MAE',s:['最终T2','入场后先-0.8R','再上涨'],q:'MAE的主要用途？',c:'A. 评估正常 adverse excursion 与SL距离\nB. 预测方向\nC. 替代止损\nD. 计算点差 בלבד',a:'A。MAE能帮助判断止损是否落在常见噪音内。'},
{id:'RK010',t:'SLIPPAGE',s:['计划Entry 100','实际100.4','SL仍96'],q:'真实风险相比计划？',c:'A. 增加\nB. 不变\nC. 降低\nD. 无法定义',a:'A。实际成交价改变了真实风险距离。'},
{id:'RK011',t:'SPREAD',s:['新闻时点差扩大','SL很近','Bid/Ask触发'],q:'为何回测可能偏乐观？',c:'A. 若只用Mid/Close，可能漏掉实际触发和成交成本\nB. 因为K线颜色\nC. ATR无效\nD. 只影响多单',a:'A。Spread和触发侧必须进入执行模拟。'},
{id:'RK012',t:'MIN STOP',s:['理论BE=Entry','Broker最小止损距离不允许','改单被拒'],q:'程序应该？',c:'A. 仍标记BE成功\nB. 记录拒单并保持旧SL/重试规则\nC. 删除交易\nD. 直接平仓',a:'B。显示状态必须和Broker实际结果一致。'},
{id:'RK013',t:'TARGET',s:['固定3R目标','前方1.3R处有高周期障碍','大多数交易到此回撤'],q:'应研究什么？',c:'A. 市场目标是否优于硬固定3R\nB. 继续提高到5R\nC. 删除SL\nD. 只看胜率',a:'A。RR不能脱离真实市场空间。'},
{id:'RK014',t:'RISK DRIFT',s:['先固定0.1手','不同SL距离','每笔风险不同'],q:'问题是什么？',c:'A. 账户风险漂移\nB. 正常\nC. 只影响盈利单\nD. 解决办法是更大杠杆',a:'A。若目标是固定风险，应先定风险再反推手数。'},
{id:'RK015',t:'DUPLICATE',s:['同一Setup','EA重启','忘记已持仓状态'],q:'最危险后果？',c:'A. 重复授权/重复开仓\nB. 只丢日志\nC. 只影响图表\nD. 无影响',a:'A。恢复持仓与授权ID是账户级状态机核心。'},
{id:'RK016',t:'ORDER OF EVENTS',s:['同一根K线先到T1又回SL','只用OHLC回测'],q:'为什么需要更细执行规则？',c:'A. OHLC无法可靠给出盘中先后顺序\nB. 因为T1无效\nC. 因为必须用Tick Volume\nD. 只影响空单',a:'A。事件顺序会决定结果和状态。'},
{id:'RK017',t:'PARTIAL R',s:['1R处减半','剩余BE','最终退出'],q:'整笔收益约多少？',c:'A. 0R\nB. 0.5R\nC. 1R\nD. 2R',a:'B。半仓在+1R兑现贡献约+0.5R，剩余0R。'},
{id:'RK018',t:'ACCOUNTING',s:['一笔分两次平仓','报表按两个Deal','系统按一笔Trade'],q:'审计需要什么？',c:'A. 用position/trade id把执行事件归并\nB. 把Deal都当独立策略交易\nC. 删除部分平仓\nD. 只看余额',a:'A。账户级统计必须区分Trade语义和执行Deal。'},
{id:'RK019',t:'RISK CAP',s:['已有两笔相关黄金多单','第三个相同方向信号'],q:'仅看单笔风险是否足够？',c:'A. 足够\nB. 不足，还需考虑组合/相关暴露\nC. 只看保证金\nD. 无需限制',a:'B。单笔风险不等于账户总风险。'},
{id:'RK020',t:'VOLATILITY',s:['ATR翻倍','原SL固定','仓位不变'],q:'最可能发生什么？',c:'A. 同样参数在新环境里代表完全不同风险\nB. ATR代表上涨\nC. 固定SL更安全\nD. 无影响',a:'A。波动环境变化会改变噪音和止损有效性。'},
{id:'RK021',t:'BE LABEL',s:['T1减半+剩余BE','最终净盈利','系统标整笔“BE”'],q:'统计问题是什么？',c:'A. 标签掩盖了部分兑现收益\nB. 正常\nC. 应标亏损\nD. 只看胜率即可',a:'A。结果标签要反映分阶段收益和Runner结果。'},
{id:'RK022',t:'MANUAL EXIT',s:['计划Runner到T2','人工提前平仓','无规则理由'],q:'审计中应如何记录？',c:'A. 标人工退出并与策略退出分开\nB. 当作T2\nC. 删除记录\nD. 当作BE',a:'A。否则无法区分策略问题和执行问题。'},
{id:'RK023',t:'EXPECTANCY',s:['胜率65%','平均赢0.5R','平均亏1R'],q:'单看65%胜率是否足够？',c:'A. 足够\nB. 不够，还要看平均盈亏与期望\nC. 必盈利\nD. 只看最大盈利',a:'B。高胜率也可能有负期望。'},
{id:'RK024',t:'AUDIT',s:['想验证C版管理','只有最终盈亏','无状态时间戳'],q:'缺少什么？',c:'A. T1 hit、partial done、BE moved、runner exit等事件时间\nB. 交易截图颜色\nC. 指标数量\nD. 新闻标题',a:'A。状态机验证依赖事件顺序，而不是最终净值。'}];function esc(x){return String(x).replace(/[&<>]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]))}document.getElementById('pack').innerHTML=Q.map(x=>`<article class="q" data-qid="${x.id}"><small>${x.id} · ${x.t}</small><div class="snap">${x.s.map((v,i)=>`<div><b>${['PLAN','EXECUTION','FOCUS'][i]}</b><span>${esc(v)}</span></div>`).join('')}</div><h3>${esc(x.q)}</h3><div class="choices">${esc(x.c).replace(/\n/g,'<br>')}</div><details><summary>展开答案</summary><div class="answer"><strong>参考：</strong>${esc(x.a)}</div></details></article>`).join('');</script><script src="/assets/seo-structured.js"></script><script src="/assets/account-nav.js"></script></body></html>
