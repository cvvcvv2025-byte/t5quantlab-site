<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Strategy Families Specialist 24题｜T5 Market Lab</title><meta name="description" content="六类策略专项24题：趋势跟随、均值回归、突破、动量、反转、区间交易的Regime、Trigger、Exit、逻辑冲突和EA状态切换。"><link rel="canonical" href="https://t5quantlab.com/market-lab/practice/strategy-families-specialist/"><link rel="stylesheet" href="/assets/styles.css"><link rel="stylesheet" href="/assets/account-nav.css"><style>.q{border:1px solid var(--line);border-radius:14px;background:#091827;padding:18px;margin:0 0 14px}.q small{color:var(--mint);font-weight:800}.snap{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}.snap div{border:1px solid #24415d;border-radius:10px;padding:10px;background:#071421}.snap b{color:#8fa7c1;font-size:12px}.snap span{display:block;margin-top:4px;color:#e9f4ff}.choices{line-height:1.8;color:#bdd0df}.q details{border-top:1px solid var(--line);padding-top:10px}.q summary{cursor:pointer;font-weight:800}.answer{margin-top:10px;color:#bdd0df;line-height:1.7}.answer strong{color:#9fe8d1}@media(max-width:720px){.snap{grid-template-columns:1fr}}</style></head><body><header class="topbar"><div class="container nav"><a class="brand" href="/"><span class="mark">T5</span><span>T5 Quant Lab</span></a><nav class="navlinks" id="navlinks"><a href="/market-lab/">Market Lab</a><a href="/library/strategy-families/">策略教材</a><a href="/library/">Library</a></nav><button class="menu" id="menu">☰</button></div></header><main><section class="page-hero"><div class="container"><div class="breadcrumbs"><a href="/market-lab/">Market Lab</a> / Practice / Strategy Families</div><div class="eyebrow">24 SPECIALIST SCENARIOS · REGIME · TRIGGER · EXIT</div><h1>先决定你在做哪种策略，再决定指标和入场。</h1><p>这24题训练趋势跟随、均值回归、突破、动量、反转与区间交易的环境、授权、失效和逻辑冲突。</p><div class="actions"><a class="btn primary" href="#pack">开始24题</a><a class="btn" href="/library/strategy-families/">先看教材</a></div></div></section><section class="section"><div class="container" id="pack"></div></section></main><footer class="footer"><div class="container"><div class="risk">策略分类用于研究与规则设计，不代表任何类型具有确定优势。</div></div></footer><script src="/assets/main.js"></script><script>const Q=[
{id:'SF001',t:'TREND',s:['EMA多头排列','ADX上升','回踩后恢复'],q:'最符合哪类策略？',c:'A. 趋势跟随\nB. 均值回归\nC. 区间反转\nD. 随机',a:'A。核心假设是既有方向性运动继续。'},
{id:'SF002',t:'MEAN REVERSION',s:['价格偏离VWAP','ADX低','区间边界完整'],q:'更适合研究哪类策略？',c:'A. 均值回归\nB. 突破追随\nC. 趋势加仓\nD. 新闻动量',a:'A。低方向性和完整边界更符合均值回归前提。'},
{id:'SF003',t:'BREAKOUT',s:['波动压缩','边界清晰','实体收盘突破'],q:'突破策略下一步更关注？',c:'A. 外侧Acceptance与Retest\nB. RSI是否超买就反手\nC. 固定均线交叉\nD. 删除止损',a:'A。突破策略核心是边界失效与外侧接受。'},
{id:'SF004',t:'MOMENTUM',s:['价格加速','ROC上升','离高周期目标很近'],q:'动量强就一定应该追吗？',c:'A. 是\nB. 否，还要检查位置和剩余空间\nC. 只看ROC\nD. 只要ADX高',a:'B。动量和位置必须分开。'},
{id:'SF005',t:'REVERSAL',s:['RSI背离','趋势结构仍HH/HL','无接管'],q:'反转策略是否已经完成授权？',c:'A. 是\nB. 否，只是警报，仍缺价格接管\nC. 必须做空\nD. 应取消SL',a:'B。反转策略需要原趋势失效与控制权转换。'},
{id:'SF006',t:'RANGE',s:['箱体清晰','价格在中部','Stochastic超卖'],q:'区间策略合理动作？',c:'A. 中部做多\nB. 等边界位置，不因振荡指标极值在中部入场\nC. 追空\nD. 加倍仓位',a:'B。区间策略的位置优势在边界，不在中部。'},
{id:'SF007',t:'CONFLICT',s:['趋势过滤=多','RSI超买=空','同一时刻冲突'],q:'系统必须先解决什么？',c:'A. 策略优先级/Regime状态\nB. 再加一个指标\nC. 把两个信号都下单\nD. 只看胜率',a:'A。趋势跟随与均值回归不能无优先级混在同一入口。'},
{id:'SF008',t:'REGIME',s:['ADX 12','EMA缠绕','Bollinger收窄'],q:'趋势策略应如何处理？',c:'A. 降低/禁止趋势Entry\nB. 加仓追趋势\nC. 调快均线直到有信号\nD. 无需改变',a:'A。Regime过滤的职责是避免在不适环境运行策略。'},
{id:'SF009',t:'SWITCH',s:['原区间','实体突破上沿','外侧成交/接受增加'],q:'策略状态可能从什么切到什么？',c:'A. Range → Breakout/Trend\nB. Trend → Range\nC. Reversal → Mean Reversion\nD. 不应切换',a:'A。边界被接受后原均值回归逻辑应停用。'},
{id:'SF010',t:'EXIT',s:['趋势策略','价格仍在趋势结构','MACD轻微回落'],q:'若MACD只是辅助，是否应立即退出？',c:'A. 应\nB. 不一定，退出规则必须按预先职责定义\nC. 永不退出\nD. 只看RSI',a:'B。辅助指标不能临时取代主退出逻辑。'},
{id:'SF011',t:'BREAKOUT COST',s:['新闻扩张','突破很快','滑点明显'],q:'突破策略回测必须重点加入？',c:'A. 成交滑点和Stop/Market执行假设\nB. 更多颜色\nC. 更高胜率阈值\nD. 取消手续费',a:'A。突破型策略对执行成本尤其敏感。'},
{id:'SF012',t:'MEAN REVERSION FAIL',s:['价格离均值越来越远','ADX升高','BandWidth扩张'],q:'继续加仓均值回归最大风险？',c:'A. 新趋势形成，均值回归假设失效\nB. 价格一定回归\nC. ADX代表反转\nD. BandWidth无意义',a:'A。最危险的是把趋势建立误读成更好的均值回归价格。'},
{id:'SF013',t:'TREND LATE',s:['趋势已运行很久','距离扩张','目标空间很小'],q:'趋势跟随仍可做，但最需检查？',c:'A. 趋势年龄与剩余空间\nB. 是否超买就必空\nC. 是否再加指标\nD. 是否缩小图表',a:'A。顺势不等于任何位置都值得追。'},
{id:'SF014',t:'REVERSAL',s:['Sweep高点','快速Reclaim','随后Micro Break'],q:'这比单独背离更接近什么？',c:'A. 反转/接管执行链\nB. 均值回归公式\nC. 趋势继续的唯一证据\nD. 无意义',a:'A。价格层接管比振荡器极值更接近正式授权。'},
{id:'SF015',t:'MOMENTUM',s:['ROC强','价格新高','成交跟随弱'],q:'动量策略应如何理解？',c:'A. 仍需确认动量是否具有持续性和位置支持\nB. ROC强就无条件做多\nC. 成交量永不重要\nD. 应反手',a:'A。Momentum不是单一数值开关。'},
{id:'SF016',t:'RANGE BREAK',s:['边界第四次测试','反弹越来越弱','压缩到上沿'],q:'区间策略此时风险是什么？',c:'A. 边界可能被吸收并转突破\nB. 第四次一定更强\nC. 应无限逆势加仓\nD. 边界不会失效',a:'A。多次测试和压缩会改变边界质量。'},
{id:'SF017',t:'EA STATE',s:['Trend/Range双模型','切换条件模糊','回测后人工解释'],q:'程序化第一步？',c:'A. 冻结Regime状态机和切换条件\nB. 让EA自行猜\nC. 每笔手工改\nD. 只优化参数',a:'A。双模型的关键不是两个Entry，而是状态切换。'},
{id:'SF018',t:'AUDIT',s:['总PF不错','趋势单亏','均值回归单赚'],q:'应该如何统计？',c:'A. 分策略家族统计PF/MFE/MAE/成本\nB. 只看总净值\nC. 删除亏损家族记录\nD. 只看胜率',a:'A。总净值会掩盖某个家族没有优势。'},
{id:'SF019',t:'ABlation',s:['突破策略加ADX后PF提升','交易数大降'],q:'下一步应看？',c:'A. 样本量、期望、稳健性和样本外，不只看PF\nB. 立即上线\nC. 再加五个过滤器\nD. 只看最大盈利',a:'A。过滤器可能只是把样本压小。'},
{id:'SF020',t:'OVERFIT',s:['不同家族共用大量参数','每段历史都调到最好'],q:'主要风险？',c:'A. 过拟合与策略身份模糊\nB. 一定更稳健\nC. 参数越多越准确\nD. 无风险',a:'A。不同策略应保持清晰假设和少量必要参数。'},
{id:'SF021',t:'TARGET',s:['趋势策略','前方无明显障碍','Runner存在'],q:'与均值回归相比，管理上更可能？',c:'A. 允许更长尾Runner\nB. 必须固定1R\nC. 只在均值处平仓\nD. 无区别',a:'A。趋势策略通常更依赖少数大推动贡献。'},
{id:'SF022',t:'MEAN TARGET',s:['区间下沿做多','POC/均值在中部','上沿更远'],q:'均值回归第一目标更自然的是？',c:'A. 中部均值/价值中心\nB. 无限Runner\nC. 必须突破上沿\nD. 1.618扩展',a:'A。策略假设本身就是回归到均值。'},
{id:'SF023',t:'RESEARCH',s:['一个Entry看起来既像突破又像动量','想评估结果'],q:'最需要提前记录什么？',c:'A. StrategyFamily标签与授权原因\nB. 只记录方向\nC. 只记录盈亏\nD. 图表颜色',a:'A。否则不同假设会混在一起无法比较。'},
{id:'SF024',t:'METHOD AGNOSTIC',s:['MACD用户','PA用户','SMC用户'],q:'T5统一验证框架应保留什么？',c:'A. Regime/Context、Trigger、Invalidation、Risk、Audit\nB. 强制所有人改学SMC\nC. 只看指标\nD. 只看形态',a:'A。方法可以不同，验证原则应一致。'}];function esc(x){return String(x).replace(/[&<>]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]))}document.getElementById('pack').innerHTML=Q.map(x=>`<article class="q" data-qid="${x.id}"><small>${x.id} · ${x.t}</small><div class="snap">${x.s.map((v,i)=>`<div><b>${['REGIME','SIGNAL','FOCUS'][i]}</b><span>${esc(v)}</span></div>`).join('')}</div><h3>${esc(x.q)}</h3><div class="choices">${esc(x.c).replace(/\n/g,'<br>')}</div><details><summary>展开答案</summary><div class="answer"><strong>参考：</strong>${esc(x.a)}</div></details></article>`).join('');</script><script src="/assets/seo-structured.js"></script><script src="/assets/account-nav.js"></script></body></html>
