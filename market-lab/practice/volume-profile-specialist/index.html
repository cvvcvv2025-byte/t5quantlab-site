<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Volume Profile Specialist 24题｜T5 Market Lab</title><meta name="description" content="Volume Profile专项24题：POC/HVN/LVN、VAH/VAL、价值迁移、Session/Composite、接受拒绝、数据源Parity与EA规则化。"><meta property="og:title" content="Volume Profile Specialist 24题｜T5 Market Lab"><meta property="og:description" content="Volume Profile专项24题：POC/HVN/LVN、VAH/VAL、价值迁移、Session/Composite、接受拒绝、数据源Parity与EA规则化。"><meta property="og:type" content="article"><meta property="og:url" content="https://t5quantlab.com/market-lab/practice/volume-profile-specialist/"><meta name="twitter:card" content="summary"><meta name="twitter:title" content="Volume Profile Specialist 24题｜T5 Market Lab"><meta name="twitter:description" content="Volume Profile专项24题：POC/HVN/LVN、VAH/VAL、价值迁移、Session/Composite、接受拒绝、数据源Parity与EA规则化。"><link rel="canonical" href="https://t5quantlab.com/market-lab/practice/volume-profile-specialist/"><link rel="stylesheet" href="/assets/styles.css"><link rel="stylesheet" href="/assets/account-nav.css"><style>.q{border:1px solid var(--line);border-radius:14px;background:#091827;padding:18px;margin:0 0 14px}.q small{color:var(--mint);font-weight:800}.snap{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}.snap div{border:1px solid #24415d;border-radius:10px;padding:10px;background:#071421}.snap b{color:#8fa7c1;font-size:12px}.snap span{display:block;margin-top:4px;color:#e9f4ff}.choices{line-height:1.8;color:#bdd0df}.q details{border-top:1px solid var(--line);padding-top:10px}.q summary{cursor:pointer;font-weight:800}.answer{margin-top:10px;color:#bdd0df;line-height:1.7}.answer strong{color:#9fe8d1}@media(max-width:720px){.snap{grid-template-columns:1fr}}</style><link rel="stylesheet" href="/assets/specialist-trainer.css"></head><body><header class="topbar"><div class="container nav"><a class="brand" href="/"><span class="mark">T5</span><span>T5 Quant Lab</span></a><nav class="navlinks" id="navlinks"><a href="/market-lab/">Market Lab</a><a href="/library/volume-profile-structure/">Profile教材</a><a href="/library/">Library</a></nav><button class="menu" id="menu">☰</button></div></header><main><section class="page-hero"><div class="container"><div class="breadcrumbs"><a href="/market-lab/">Market Lab</a> / Practice / Volume Profile</div><div class="eyebrow">24 SPECIALIST SCENARIOS · POC · HVN · LVN · VALUE</div><h1>不要把Profile读成几条支撑阻力线。</h1><p>这24题训练价值、接受/拒绝、POC迁移、HVN/LVN、Session与Composite、数据源Parity和程序审计。</p><div class="actions"><a class="btn primary" href="#pack">开始24题</a><a class="btn" href="/library/volume-profile-structure/">先看教材</a></div></div></section><section class="section"><div class="container" id="pack"></div></section></main><footer class="footer"><div class="container"><div class="risk">成交量分布用于理解市场接受度，不构成方向预测。</div></div></footer><script src="/assets/main.js"></script><script>const Q=[
{id:'V001',t:'POC',s:['POC在区间中部','价格反复穿越','无边界反应'],q:'把POC直接当反转线合理吗？',c:'A. 合理\nB. 不合理，POC更像价值中心/高参与区\nC. 只要第一次触碰就做反向\nD. POC永不失效',a:'B。POC是所选样本内成交最集中的价格之一。'},
{id:'V002',t:'HVN',s:['价格进入HVN','速度下降','来回成交'],q:'更合理的解释？',c:'A. 历史/当前接受度较高，容易形成平衡\nB. 必须立即突破\nC. 一定反转\nD. 说明没有成交量',a:'A。HVN常对应较高接受度和停留。'},
{id:'V003',t:'LVN',s:['进入LVN','K线扩张','停留少'],q:'这种行为最符合？',c:'A. 低接受区快速穿越\nB. POC迁移\nC. 固定支撑\nD. 均值回归必然发生',a:'A。LVN常见特征之一就是快速穿越。'},
{id:'V004',t:'LVN',s:['昨日LVN','今日到达后横盘','新成交增加'],q:'为什么不矛盾？',c:'A. Profile是历史样本统计，新交易可以建立新价值\nB. LVN数据一定错\nC. 价格不应横盘\nD. 必须删除今日数据',a:'A。旧LVN可以逐步转成新高成交区。'},
{id:'V005',t:'VALUE',s:['Break区间上沿','外侧成交增加','POC上移'],q:'这更支持什么？',c:'A. Acceptance / 价值向上迁移\nB. 必须反转\nC. 假突破已确认\nD. 无法判断任何事',a:'A。价值和POC向突破方向迁移可支持接受。'},
{id:'V006',t:'FAILED BREAK',s:['突破上沿','很快回区间','POC仍在原区间'],q:'更合理解释？',c:'A. 外侧未建立新价值，Break可能失败\nB. 趋势一定继续\nC. POC自动变成止损\nD. 必须追多',a:'A。重新进入原价值区是失败突破证据之一。'},
{id:'V007',t:'VAH',s:['价格在VAH附近','无拒绝','实体持续站上'],q:'VAH应继续被当成不可突破阻力吗？',c:'A. 是\nB. 否，若持续接受上方，角色已经变化\nC. 只看一次触碰\nD. 删除Profile',a:'B。边界不是墙，接受度更重要。'},
{id:'V008',t:'VAL',s:['VAL下破','立即Reclaim','回到Value'],q:'这最接近？',c:'A. Lower acceptance失败/拒绝\nB. 趋势确认\nC. POC突破\nD. 无意义',a:'A。外侧无法留存并快速收回，是拒绝/失败接受。'},
{id:'V009',t:'SESSION',s:['昨日Profile','今日Session','两个POC不同'],q:'哪个“正确”？',c:'A. 只能有一个正确\nB. 二者回答不同时间窗口的问题\nC. 取更靠近价格的\nD. 随机选',a:'B。Session和更长样本的Profile职责不同。'},
{id:'V010',t:'COMPOSITE',s:['Composite HVN','日内LVN','当前价格到达'],q:'多窗口信息冲突时应？',c:'A. 预先冻结哪个窗口负责背景/执行\nB. 事后挑对自己有利的\nC. 全部叠在一起\nD. 只看最粗的一条',a:'A。ProfileWindow必须有职责分工。'},
{id:'V011',t:'DATA',s:['XAUUSD CFD','Tick Volume','COMEX GC Real Volume'],q:'能否把两者阈值完全等同？',c:'A. 能\nB. 不能，数据源含义和结构不同\nC. 只有M1不能\nD. 只要相关性高就能',a:'B。期货集中成交量与CFD Tick Volume不是同一数据。'},
{id:'V012',t:'PARITY',s:['TV Broker A','MT5 Broker B','POC略不同'],q:'首先检查什么？',c:'A. Session切分、数据源、Volume类型\nB. 字体\nC. 图表颜色\nD. Fib设置',a:'A。Profile对数据源和时间窗口高度敏感。'},
{id:'V013',t:'ENTRY',s:['价格到HVN边缘','无反应','结构中性'],q:'仅凭HVN边缘可正式入场吗？',c:'A. 可以\nB. 不应，先等待Reaction/Execution\nC. 必须反手\nD. 只要止损小就行',a:'B。Profile提供Location，不负责Entry授权。'},
{id:'V014',t:'BREAK',s:['LVN上方突破','Retest守住','POC上移'],q:'这条链更像？',c:'A. Break-Acceptance-Retest\nB. Sweep-Reversal\nC. 纯均值回归\nD. 无效',a:'A。结构与价值迁移共同支持突破接受。'},
{id:'V015',t:'REJECTION',s:['价格探出Value','成交未跟随','快速Reclaim'],q:'最值得记录的不是“碰线”，而是？',c:'A. 外侧停留与接受失败\nB. K线颜色\nC. POC绝对数值\nD. 指标数量',a:'A。拒绝来自无法在外侧建立交易。'},
{id:'V016',t:'MIGRATION',s:['连续3个Session','POC逐日上移','价格也抬高'],q:'更合理的描述？',c:'A. 价值向上迁移\nB. 一定顶部\nC. POC失效\nD. 说明震荡',a:'A。价值中心持续上移是趋势环境证据之一。'},
{id:'V017',t:'RANGE',s:['价格在VAH/VAL间','POC居中','边界多次反应'],q:'更适合研究哪类策略？',c:'A. 区间/均值回归\nB. 无条件追突破\nC. 趋势加速\nD. 只做新闻',a:'A。前提是边界仍被尊重且没有接受突破。'},
{id:'V018',t:'PROFILE WINDOW',s:['Swing Profile','Session Profile','Composite Profile'],q:'程序审计最需要额外记录什么？',c:'A. ProfileWindow类型和起止范围\nB. 屏幕分辨率\nC. 鼠标位置\nD. EA颜色',a:'A。没有窗口定义就无法复核POC/HVN/LVN。'},
{id:'V019',t:'EA',s:['人工说“价值上移”','程序要识别','POC轻微波动'],q:'需要冻结什么？',c:'A. 迁移窗口、最小位移、连续次数\nB. 只看肉眼\nC. 每笔手工确认\nD. 固定买入',a:'A。模糊描述必须变成阈值和状态。'},
{id:'V020',t:'LOOKAHEAD',s:['用整天最终Profile','回测中上午就使用','当天尚未结束'],q:'问题是什么？',c:'A. Future leak\nB. 正常做法\nC. Spread\nD. 交易时段',a:'A。不能在早盘使用当天最终成交分布。'},
{id:'V021',t:'HVN EDGE',s:['HVN内部','价格缓慢','边缘附近加速'],q:'这更说明Profile可用于？',c:'A. 理解接受区与过渡区\nB. 预测绝对方向\nC. 保证目标\nD. 替代止损',a:'A。Profile强项是解释停留与穿越。'},
{id:'V022',t:'ABlation',s:['策略含Profile+VWAP+RSI','回测提升','不知道贡献'],q:'下一步？',c:'A. 做Ablation分别移除\nB. 再加MACD\nC. 只看胜率\nD. 调大仓位',a:'A。否则无法确认Profile是否真正提供增量信息。'},
{id:'V023',t:'AUDIT',s:['Entry在Value外','后续失败','想复盘'],q:'最关键字段组合？',c:'A. EntryRelativeToProfile + StructureEvent + ValueMigration\nB. 账户昵称\nC. 图表主题\nD. K线颜色',a:'A。这三项能还原位置、结构和价值状态。'},
{id:'V024',t:'TARGET',s:['进入LVN','前方下一HVN','推进快速'],q:'下一HVN更适合被理解成？',c:'A. 可能的接受/减速区域参考\nB. 必达止盈位\nC. 永久阻力\nD. 无关',a:'A。它是潜在市场障碍/价值区参考，不是保证。'}];function esc(x){return String(x).replace(/[&<>]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]))}document.getElementById('pack').innerHTML=Q.map(x=>`<article class="q" data-qid="${x.id}"><small>${x.id} · ${x.t}</small><div class="snap">${x.s.map((v,i)=>`<div><b>${['PROFILE','PRICE','FOCUS'][i]}</b><span>${esc(v)}</span></div>`).join('')}</div><h3>${esc(x.q)}</h3><div class="choices">${esc(x.c).replace(/\n/g,'<br>')}</div><details><summary>展开答案</summary><div class="answer"><strong>参考：</strong>${esc(x.a)}</div></details></article>`).join('');</script><script src="/assets/seo-structured.js"></script><script src="/assets/account-nav.js"></script><script src="/assets/specialist-trainer.js"></script></body></html>
