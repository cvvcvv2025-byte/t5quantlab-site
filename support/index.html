<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>客户支持｜T5 Quant Lab</title><link rel="stylesheet" href="/assets/styles.css"><link rel="icon" href="/favicon.svg"><meta name="robots" content="noindex,follow"></head><body><header class="topbar"><div class="container nav"><a class="brand" href="/">T5 Quant Lab</a><nav class="navlinks"><a href="/account/">My T5</a><a href="/support/">客户支持</a><a href="/privacy/">隐私说明</a></nav></div></header><main class="container" style="max-width:900px;padding-top:100px;padding-bottom:60px"><h1>客户支持</h1><p>无法登录、付款后权限未开通、下载或安装失败、退款申请，都可以在这里记录。请提供订单号、平台和错误信息，帮助我们核对。</p><p>不要提交密码、验证码、API密钥、完整银行卡资料或未经处理的私有源码。此入口以站内工单提供回复，请保存查询码。</p><form id="supportForm" class="card"><p><label>联系邮箱<br><input name="email" type="email" maxlength="254" required></label></p><p><label>订单号（可选）<br><input name="order" maxlength="100"></label></p><p><label>问题描述<br><textarea name="message" minlength="10" maxlength="4000" rows="7" required style="width:100%"></textarea></label></p><p><label><input name="consent" type="checkbox" required>我同意为处理此问题保存提交的信息，已阅读<a href="/privacy/">隐私说明</a>。</label></p><button class="btn primary">提交问题</button></form><p id="supportReceipt"></p><section class="card"><h2>查看回复</h2><label for="queryToken">工单查询码</label><input id="queryToken" autocomplete="off" style="width:100%"><button id="checkTicket" class="btn" type="button">查询回复</button><p id="supportStatus" role="status" aria-live="polite"></p></section><script src="/assets/support.js"></script></main></body></html>
