<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>取消邮件订阅｜T5 Quant Lab</title><meta name="robots" content="noindex,nofollow"><link rel="stylesheet" href="/assets/styles.css"><link rel="stylesheet" href="/assets/account.css"></head><body><header class="topbar"><div class="container nav"><a class="brand" href="/"><span class="mark">T5</span><span>T5 Quant Lab</span></a></div></header><main><section class="page-hero"><div class="container account-wrap"><div class="eyebrow">EMAIL PREFERENCES</div><h1>取消产品与推广邮件。</h1><p>取消后仍可正常使用T5账户；验证码、付款、权限和必要服务通知不受影响。</p></div></section><section class="section"><div class="container account-wrap"><div class="account-card"><p>确认不再接收 T5 产品更新、研究内容和优惠信息？</p><div class="account-actions"><button id="confirm" class="btn primary" type="button">确认取消订阅</button><a class="btn" href="/account/">返回 My T5</a></div><div id="status" class="account-status account-hidden"></div></div></div></section></main><script src="/assets/main.js"></script><script>const $=id=>document.getElementById(id);function show(t,c=''){const x=$('status');x.textContent=t;x.className='account-status'+(c?' '+c:'');x.classList.remove('account-hidden')}$('confirm').addEventListener('click',async()=>{const q=new URLSearchParams(location.search);const user_id=q.get('uid')||'',token=q.get('token')||'';if(!user_id||!token){show('退订链接无效。','account-warn');return}const b=$('confirm');b.disabled=true;try{const r=await fetch('/api/marketing/unsubscribe',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({user_id,token})});const d=await r.json();if(!r.ok||!d.ok)throw new Error(d.error||'退订失败');show('已取消营销邮件订阅。','account-good');b.classList.add('account-hidden')}catch(e){show(e.message,'account-warn');b.disabled=false}});</script></body></html>
